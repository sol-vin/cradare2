name: cradare2
version: 0.2.21

authors:
  - sol-vin <ian@sol.vin>

description: A powerful Crystal library and DSL for controlling radare2 via r2pipe protocols and debugging native binaries.

crystal: ">= 1.10.0"

license: MIT

dependencies:
  opal:
    github: sol-vin/opal
    branch: main

development_dependencies:
  carbon:
    github: sol-vin/carbon
    branch: main

targets:
  r2-crystal:
    main: src/bin/r2_crystal.cr
  carbon:
    main: lib/carbon/src/carbon/cli.cr
