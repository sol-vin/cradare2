name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0

      - name: Verify Formatting & Run Tests
        run: |
          crystal tool format --check
          crystal spec

      - name: Generate API Documentation
        run: |
          crystal docs
          tar -czf cradare2-docs-${{ github.ref_name }}.tar.gz docs/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cradare2-docs-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
